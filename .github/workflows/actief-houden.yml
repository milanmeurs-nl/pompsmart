name: Actief houden

# GitHub zet geplande workflows in een publieke repository uit na 60 dagen zonder commits.
# Daarom maakt deze workflow op de 1e van elke maand een kleine commit, zodat de prijzen en
# IndexNow blijven bijwerken. Een commit met GITHUB_TOKEN start de site-workflow niet opnieuw.
on:
  schedule:
    - cron: "41 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datum bijwerken en committen
        run: |
          date -u +%Y-%m-%d > .github/actief.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actief.txt
          git diff --cached --quiet && { echo "Niets te committen"; exit 0; }
          git commit -m "Actief houden, zodat GitHub de geplande workflows niet uitzet"
          git push
