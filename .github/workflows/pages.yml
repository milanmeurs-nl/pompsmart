name: Site publiceren

# Publiceert de site bij elke push naar main, en elke 30 minuten opnieuw via een externe
# cron-dienst (workflow_dispatch), met verse prijzen uit Duitsland (Tankerkönig), België
# (Statbel) en Nederland (CBS). GitHubs eigen schema hieronder is de reserve: GitHub start
# geplande runs bij drukte soms uren later.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Twee jobs, zoals in GitHubs eigen sjabloon: eerst bouwen en uploaden, dan publiceren.
# Zo is de upload helemaal klaar voordat de publicatie hem zoekt; in één job vond GitHub
# de upload soms een seconde later nog niet ("Found 0 artifact(s)").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Site samenstellen
        run: |
          mkdir -p site
          cp index.html CNAME robots.txt og-image.png site/
          # IndexNow-sleutelbestand (zie scripts/indexnow.mjs)
          cp [0-9a-f]*.txt site/
          # De prijzen veranderen bij elke publicatie, dus de sitemap krijgt de datum van vandaag
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://pompsmart.nl/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(date -u +%Y-%m-%d)" > site/sitemap.xml

      # Lukt dit niet, dan gaat de site toch online; die valt dan terug op de gemiddelde prijzen.
      - name: Live Duitse prijzen ophalen
        continue-on-error: true
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: node scripts/fetch-de-prices.mjs site/de-prijzen.json

      - name: Belgische maximumprijzen ophalen
        continue-on-error: true
        run: node scripts/fetch-be-prices.mjs site/be-prijzen.json

      - name: Nederlandse gemiddelde prijs ophalen
        continue-on-error: true
        run: node scripts/fetch-nl-prices.mjs site/nl-prijzen.json

      # Lukt dit niet, dan staat de homepage er gewoon, alleen zonder grenspagina's.
      - name: Pagina's per grensovergang maken
        continue-on-error: true
        run: node scripts/build-pages.mjs site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Mislukt het publiceren door een storing bij GitHub, dan na 2 minuten nog één keer:
      # korte storingen bij GitHub Pages duren vaak een minuut of twee.
      - name: Even wachten voor een tweede poging
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
