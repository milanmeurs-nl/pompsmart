name: Site publiceren

# Publiceert de site bij elke push naar main, en elke 30 minuten opnieuw
# met verse Duitse grensprijzen (Tankerkönig) en de Belgische maximumprijs van vandaag (Statbel).
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Site samenstellen
        run: |
          mkdir -p site
          cp index.html CNAME robots.txt og-image.png site/
          # De prijzen veranderen bij elke publicatie, dus de sitemap krijgt de datum van vandaag
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://pompsmart.nl/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(date -u +%Y-%m-%d)" > site/sitemap.xml

      # Lukt dit niet, dan gaat de site toch online; die valt dan terug op de gemiddelde prijzen.
      - name: Live Duitse prijzen ophalen
        continue-on-error: true
        env:
          TANKERKOENIG_API_KEY: ${{ secrets.TANKERKOENIG_API_KEY }}
        run: node scripts/fetch-de-prices.mjs site/de-prijzen.json

      - name: Belgische maximumprijzen ophalen
        continue-on-error: true
        run: node scripts/fetch-be-prices.mjs site/be-prijzen.json

      - name: Nederlandse gemiddelde prijs ophalen
        continue-on-error: true
        run: node scripts/fetch-nl-prices.mjs site/nl-prijzen.json

      # Lukt dit niet, dan staat de homepage er gewoon, alleen zonder grenspagina's.
      - name: Pagina's per grensovergang maken
        continue-on-error: true
        run: node scripts/build-pages.mjs site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
